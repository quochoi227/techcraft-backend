spring:
  application:
    name: techcraft-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 50MB

jwt:
  secret: ${SECRET_KEY}
  access-token-expiry-ms: ${ACCESS_TOKEN_EXPIRY_MS}
  refresh-token-expiry-days: ${REFRESH_TOKEN_EXPIRY_DAYS}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-email-name: ${RESEND_FROM_EMAIL_NAME}

cloudinary:
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  default-folder: ${CLOUDINARY_DEFAULT_FOLDER:techcraft/products}

app:
  email-verification-token-expiry-hours: 24
  password-reset-token-expiry-hours: 1
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  admin:
    auto-create: ${ADMIN_AUTO_CREATE:true}
    email: ${ADMIN_EMAIL:admin@techcraft.com}
    password: ${ADMIN_PASSWORD:Admin@123456}
    full-name: ${ADMIN_FULLNAME:Administrator}
    phone: ${ADMIN_PHONE:0123456789}

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  embedding-dimension: 3072
  temperature: 0.3

pgvector:
  top-k: ${PGVECTOR_TOP_K:4}
  min-similarity: ${PGVECTOR_MIN_SIMILARITY:0.55}
